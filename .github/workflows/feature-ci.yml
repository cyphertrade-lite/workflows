name: Feature CI

# Reusable FEATURE/PR workflow for CypherLite services.
#
# Build + lint + test only — no image, no deploy. Runs on the cyphertrade-lite
# self-hosted runners; private Rust deps (ITYFT/* + cyphertrade-lite/*) are
# fetched with a CI_GITHUB_PAT secret via git url.insteadOf.
#
# Called by a service's .github/workflows/feature-ci.yml:
#
#   jobs:
#     check:
#       uses: cyphertrade-lite/workflows/.github/workflows/feature-ci.yml@master
#       with:
#         UNITS: true
#       secrets: inherit

on:
  workflow_call:
    inputs:
      UNITS:
        description: "Run `cargo test --all`"
        required: false
        type: boolean
        default: true
    secrets:
      CI_GITHUB_PAT:
        description: "GitHub PAT with read access to private Rust deps (ITYFT/* + cyphertrade-lite/*) and submodules"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # ⚠️ GIT'S CONFIG VIA THE ENVIRONMENT, NOT VIA ~/.gitconfig.
      #
      # These runners are long-lived containers whose HOME persists between
      # jobs, so every file-based attempt competes with months of accumulated
      # state — proved on 2026-10-01, when setting the rewrite rule died with
      # `cannot overwrite multiple values with a single value` and a
      # ~/.git-credentials from an earlier job that day was still sitting there.
      # Scrubbing the file worked and the rules read back correctly, and cargo
      # STILL could not fetch, so the file is not the only thing in play.
      #
      # GIT_CONFIG_COUNT outranks every config file, is inherited by every
      # subprocess cargo spawns, and leaves NOTHING on the machine for the next
      # job to trip over. A job should not be able to poison the next one.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ secrets.CI_GITHUB_PAT }}@github.com/.insteadOf"
      GIT_CONFIG_VALUE_0: "https://github.com/"
      GIT_CONFIG_KEY_1: "url.https://x-access-token:${{ secrets.CI_GITHUB_PAT }}@github.com/.insteadOf"
      GIT_CONFIG_VALUE_1: "git@github.com:"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_GITHUB_PAT }}

      # ⚠️ AFTER checkout, NOT before, and this ordering is the whole fix.
      #
      # `actions/checkout` ends by writing a GLOBAL
      # `http.https://github.com/.extraheader AUTHORIZATION: basic ...` and by
      # running `--unset-all url.https://github.com/.insteadOf`. Anything this
      # step does first is therefore either wiped or left competing with that
      # header, and a request carrying both a header and URL userinfo is what
      # github answered `Repository not found` to all morning — while checkout's
      # own fetches, including the private `proto` submodule, succeeded on the
      # same token in the same job.
      #
      # So: drop checkout's global header (its own work is done by now, and the
      # local one it set on this repo is untouched), then rewrite the URL. Proved
      # in CI on 2026-10-01 — `credential.helper store` FAILED and the same token
      # inline in the URL fetched the same private repo in the same shell.
      - name: Configure git auth for private cargo deps
        env:
          T: ${{ secrets.CI_GITHUB_PAT }}
        run: |
          # ⚠️ THE RUNNER'S HOME IS PERSISTENT ACROSS JOBS. These are
          # self-hosted containers, so ~/.gitconfig and ~/.git-credentials
          # SURVIVE, and every run has been appending to them. Proved in CI on
          # 2026-10-01: a plain `git config --global url.<...>.insteadOf` died
          # with `error: cannot overwrite multiple values with a single value`
          # (exit 5), and `ls` showed a ~/.git-credentials left by an earlier
          # job that day.
          #
          # That is also why this looked like a dead token for hours. Each
          # DISTINCT token makes its own `url.https://x-access-token:<token>@...`
          # key, so a stale one keeps its own rewrite rule for
          # `https://github.com/` and can win the match — authenticating every
          # cargo fetch with an expired credential, which github answers
          # `Repository not found`.
          #
          # So scrub first, then set exactly one rule. The job must not depend on
          # what any previous job left behind.
          # ⚠️ --unset-all ON THE KEY, not --remove-section on the section.
          # The section form was tried first and did NOT remove the header;
          # `--unset-all` on the exact key did, proved on a clean hosted runner
          # on 2026-10-01 where the fetch went from `Repository not found` to
          # `FETCH=ok` in the same step.
          #
          # THIS HEADER IS THE WHOLE BUG. `actions/checkout` leaves a GLOBAL
          # `http.https://github.com/.extraheader AUTHORIZATION: basic ...`
          # behind, so every later fetch carries BOTH that header and the
          # credential in the rewritten URL — and github answers a request with
          # two credentials `Repository not found`. That is why the one isolated
          # job that ever succeeded was the one with no checkout in it.
          git config --global --unset-all http.https://github.com/.extraheader || true
          for k in $(git config --global --name-only --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true); do
            git config --global --unset-all "$k" 2>/dev/null || true
          done
          git config --global --unset-all credential.helper 2>/dev/null || true
          rm -f "$HOME/.git-credentials"

          git config --global url."https://x-access-token:$T@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:$T@github.com/".insteadOf "git@github.com:"

          echo "--- effective url rewrites, credentials masked ---"
          git config --global --get-regexp '^url\.' | sed -E 's#(://[^:]*:)[^@]*@#\1***@#g'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cyphertrade-lite-feature

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        if: ${{ inputs.UNITS }}
        run: cargo test --all
