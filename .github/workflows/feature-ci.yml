name: Feature CI

# Reusable FEATURE/PR workflow for CypherLite services.
#
# Build + lint + test only — no image, no deploy. Runs on the cyphertrade-lite
# self-hosted runners; private Rust deps (ITYFT/* + cyphertrade-lite/*) are
# fetched with a CI_GITHUB_PAT secret via git url.insteadOf.
#
# Called by a service's .github/workflows/feature-ci.yml:
#
#   jobs:
#     check:
#       uses: cyphertrade-lite/workflows/.github/workflows/feature-ci.yml@master
#       with:
#         UNITS: true
#       secrets: inherit

on:
  workflow_call:
    inputs:
      UNITS:
        description: "Run `cargo test --all`"
        required: false
        type: boolean
        default: true
    secrets:
      CI_GITHUB_PAT:
        description: "GitHub PAT with read access to private Rust deps (ITYFT/* + cyphertrade-lite/*) and submodules"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Configure git auth for private cargo deps
        run: |
          # ⚠️ url.insteadOf, NOT the credential store. The store stopped
          # supplying the credential on these runners: proved inside CI on
          # 2026-10-01 with a 40-character, whitespace-free `ghp_` secret —
          # `git ls-remote` through `credential.helper store` answered
          # "Repository not found" while the SAME token inline in the URL
          # fetched the same private repo in the same shell, same step, same
          # HOME. The token was never the problem; the lookup was.
          #
          # Rewriting the URL carries the credential in the request itself, so
          # nothing has to be looked up. `-----BEGIN` style secrets would be
          # unsafe here, a PAT is not: it is already a URL-safe token.
          #
          # ⚠️ `--add` ON THE SECOND. `url.<base>.insteadOf` is MULTI-VALUED and
          # plain `git config` REPLACES rather than appends, so writing both
          # lines without it silently keeps only the last — which is exactly how
          # the first attempt at this fix still failed: the ssh form was
          # rewritten and the https form, the one cargo actually uses, was not.
          git config --global url."https://x-access-token:${{ secrets.CI_GITHUB_PAT }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${{ secrets.CI_GITHUB_PAT }}@github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_GITHUB_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cyphertrade-lite-feature

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        if: ${{ inputs.UNITS }}
        run: cargo test --all
